version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: yari-ia-glpi-backend
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yari-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: yari-ia-glpi-postgres
    restart: always
    environment:
      POSTGRES_DB: yari_glpi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yari-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: yari-ia-glpi-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - yari-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yari-ia-glpi-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yari.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    networks:
      - yari-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  yari-network:
    driver: bridge
